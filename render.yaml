# Render Blueprint: New > Blueprint > pick this repo. Creates the FinSight API.
services:
  - type: web
    name: finsight-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FINSIGHT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://finsight.vercel.app
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: ADMIN_EMAILS
        sync: false          # your email; unlocks retrain, load test and user stats on the Metrics page
      - key: DATABASE_URL
        sync: false          # optional Postgres URL (Neon). Without it, SQLite resets on every redeploy.
